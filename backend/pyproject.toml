[project]
name = "knowlix-ai-backend"
version = "0.1.0"
description = "Knowlix AI: retrieval-augmented question answering over your documents (FastAPI)."
requires-python = ">=3.11"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["models: downloads and runs the real embedding and reranking models"]
filterwarnings = ["ignore::DeprecationWarning:pypdf.*"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
